<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="sunburst" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <circle cx="256" cy="200" r="180" fill="url(#sunburst)"/>

  <!-- Golden Ray Accents -->
  <path d="M256 60 L256 95 M160 90 L180 120 M352 90 L332 120 M90 170 L125 185 M422 170 L387 185" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" opacity="0.75" />

  <!-- Book Base Structure -->
  <g transform="translate(0, 20)" filter="url(#glow)">
    <!-- Left page -->
    <path d="M256 360 C 210 320, 140 320, 96 332 L 96 172 C 140 160, 210 160, 256 195 Z" fill="#ffffff" fill-opacity="0.95" />
    <!-- Left page decorative text lines -->
    <path d="M126 210 Q 180 200 230 220 M126 240 Q 180 230 230 250 M126 270 Q 180 260 230 280" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>

    <!-- Right page -->
    <path d="M256 360 C 302 320, 372 320, 416 332 L 416 172 C 372 160, 302 160, 256 195 Z" fill="#f8fafc" />
    <!-- Right page decorative lines -->
    <path d="M282 220 Q 332 200 386 210 M282 250 Q 332 230 386 240 M282 280 Q 332 260 386 270" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>

    <!-- Center spine & bookmark ribbon -->
    <path d="M256 185 L 256 385" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
    <path d="M256 190 Q 275 250 265 310 L 256 300 L 247 310 Q 252 250 256 190 Z" fill="#ef4444" />
  </g>

  <!-- Sparkle Stars -->
  <polygon points="256,120 262,138 280,144 262,150 256,168 250,150 232,144 250,138" fill="url(#goldGrad)" />
  <polygon points="370,140 374,152 386,156 374,160 370,172 366,160 354,156 366,152" fill="url(#goldGrad)" opacity="0.8" />
  <polygon points="142,140 146,152 158,156 146,160 142,172 138,160 126,156 138,152" fill="url(#goldGrad)" opacity="0.8" />
</svg>
